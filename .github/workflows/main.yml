name: Build News Pages

on:
  push:
    branches:
      - tir-shipments-russia-china-3170c
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install fs-extra glob

      - name: Build news
        run: node scripts/build-news.js

      - name: Commit changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --local user.email 'action@github.com'
          git add news/*.html news.html sitemap.xml
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-build news pages"
          git push
